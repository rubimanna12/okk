<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>UppedX | Biolink</title>

  <!-- External Stylesheet -->
  <link rel="stylesheet" href="style.css" />

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Ambient Backdrop Glow -->
  <div class="ambient-glow"></div>

  <!-- Click to Enter Screen (Ensures autoplay works) -->
  <div id="click-overlay">
    <div class="click-prompt">[ click to enter ]</div>
  </div>

  <!-- Audio Element -->
  <audio id="bgm" loop preload="auto">
    <source src="assets/audio.mp3" type="audio/mp3">
  </audio>

  <!-- Main Card Container -->
  <div class="container">
    
    <!-- Profile Header -->
    <div class="profile-header">
      <div class="avatar-wrapper">
        <img src="assets/avatar.png" alt="Profile Avatar" class="avatar-img" />
      </div>

      <div class="profile-info">
        <div class="name-row">
          <span class="username">UppedX</span>
          <div class="badges-pill">
            <i data-lucide="badge-check" class="badge-icon"></i>
            <i data-lucide="gem" class="badge-icon"></i>
          </div>
        </div>

        <div class="bio-box">
          <span id="typed-text"></span><span class="cursor">|</span>
        </div>

        <div class="join-date">Joined about 2 years ago</div>
      </div>
    </div>

    <!-- Social Links Row -->
    <div class="social-row">
      <!-- Roblox Icon -->
      <a href="https://roblox.com" target="_blank" rel="noopener" class="social-link" aria-label="Roblox">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="5" width="14" height="14" rx="2.5" transform="rotate(-15 12 12)" />
        </svg>
      </a>

      <!-- Discord Icon -->
      <a href="https://discord.com" target="_blank" rel="noopener" class="social-link" aria-label="Discord">
        <svg viewBox="0 0 24 24">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.929 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.893.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
      </a>

      <!-- GitHub Icon -->
      <a href="https://github.com" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
        <svg viewBox="0 0 24 24">

        </svg>
      </a>
    </div>

    <!-- View Counter -->
    <div class="views-counter">
      <i data-lucide="eye"></i>
      <span>315</span>
    </div>

  </div>

  <!-- Floating Audio / Domain Bar -->
  <div class="bottom-bar">
    <button class="bottom-btn" aria-label="Back">
      <i data-lucide="chevron-left" style="width: 20px; height: 20px;"></i>
    </button>
    <div class="bottom-center">
      <button class="audio-toggle" id="audio-toggle" aria-label="Toggle Sound">
        <i data-lucide="volume-2" id="volume-icon" style="width: 17px; height: 17px;"></i>
      </button>
      <span>guns.lol</span>
      <button class="bottom-btn" aria-label="Reload">
        <i data-lucide="rotate-cw" style="width: 14px; height: 14px;"></i>
      </button>
    </div>
    <button class="bottom-btn" aria-label="More">
      <i data-lucide="more-horizontal" style="width: 20px; height: 20px;"></i>
    </button>
  </div>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
